name: Phase 16 PWA smoke

on:
  push:
    branches:
      - phase16-pwa-launcher

permissions:
  contents: read

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Static launcher tests
        run: |
          npm test
          npm run check

      - name: PWA and privacy contract
        run: |
          python3 - <<'PY'
          import json
          import struct
          from pathlib import Path

          site = Path("site")
          manifest = json.loads((site / "manifest.webmanifest").read_text())

          assert manifest["display"] == "standalone"
          assert manifest["start_url"] == "./"
          assert manifest["scope"] == "./"
          assert manifest["prefer_related_applications"] is False

          expected = {
              "icon-192.png": (192, 192),
              "icon-512.png": (512, 512),
              "icon-maskable-512.png": (512, 512),
          }
          for name, dims in expected.items():
              raw = (site / "icons" / name).read_bytes()
              assert raw[:8] == b"\x89PNG\r\n\x1a\n"
              width, height = struct.unpack(">II", raw[16:24])
              assert (width, height) == dims, (name, width, height)

          html = (site / "index.html").read_text()
          app = (site / "app.js").read_text()
          sw = (site / "sw.js").read_text()

          assert "connect-src https://api.github.com" in html
          assert "sessionStorage" in html
          assert "localStorage.setItem(TOKEN_KEY" not in app
          assert "sessionStorage.setItem(TOKEN_KEY" in app
          assert "innerHTML" not in app
          assert 'url.origin !== self.location.origin' in sw

          all_text = "\n".join(
              p.read_text(errors="ignore")
              for p in Path(".").rglob("*")
              if p.is_file() and ".git" not in p.parts and p.suffix != ".png"
          )
          forbidden = [
              "renatofrancoflores@gmail.com",
              "993 618 445",
              "job_search_tracker.csv",
              "01-candidate-profile.md",
              "JOB_NOTIFY_SMTP_PASSWORD",
              "ghp_",
              "github_pat_11",
          ]
          for needle in forbidden:
              assert needle not in all_text, needle

          print("PUBLIC_PWA_PRIVACY_CONTRACT=PASS")
          PY

      - name: Static-server smoke
        run: |
          python3 -m http.server --bind 127.0.0.1 --directory site 8765 >/tmp/phase16-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ >/tmp/index.html; then
              ready=1
              break
            fi
            sleep 0.3
          done
          test "$ready" = "1"

          curl -fsS http://127.0.0.1:8765/app.js >/tmp/app.js
          curl -fsS http://127.0.0.1:8765/lib.js >/tmp/lib.js
          curl -fsS http://127.0.0.1:8765/manifest.webmanifest >/tmp/manifest.json
          curl -fsS http://127.0.0.1:8765/sw.js >/tmp/sw.js
          curl -fsS http://127.0.0.1:8765/icons/icon-192.png >/tmp/icon.png

          grep -q 'Job Search Launcher' /tmp/index.html
          grep -q 'api.github.com' /tmp/lib.js
          grep -q '"display": "standalone"' /tmp/manifest.json

      - name: Pages workflow contract
        run: |
          grep -q 'actions/configure-pages@v6' .github/workflows/deploy-pages.yml
          grep -q 'actions/upload-pages-artifact@v4' .github/workflows/deploy-pages.yml
          grep -q 'actions/deploy-pages@v4' .github/workflows/deploy-pages.yml
          grep -q 'pages: write' .github/workflows/deploy-pages.yml
          grep -q 'id-token: write' .github/workflows/deploy-pages.yml
          grep -q 'path: ./site' .github/workflows/deploy-pages.yml
